<style>
  .s{fill:#c2a877;animation:tw 6s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.10}50%{opacity:.80}}
  .glow{animation:br 11s ease-in-out infinite;transform-origin:600px 292px}
  @keyframes br{0%,100%{opacity:.60;transform:scale(1)}50%{opacity:1;transform:scale(1.10)}}
  .wv{fill:none;stroke:#9c8a6e;stroke-width:1.2;stroke-linecap:round}
  .w1{animation:dr 30s linear infinite}
  .w2{animation:dr 46s linear infinite}
  .w3{animation:dr 68s linear infinite}
  @keyframes dr{from{transform:translateX(0)}to{transform:translateX(-200px)}}
  .rise{animation:rs 1.7s cubic-bezier(.2,.8,.2,1) both}
  .riseS{animation:rsS 1.7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rsS{from{opacity:0;transform:translateY(16px)}to{opacity:.86;transform:translateY(0)}}
  @keyframes rs{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .d1{animation-delay:.15s}.d2{animation-delay:.55s}.d3{animation-delay:2.9s}
  .rule{stroke:#a5661a;stroke-width:1;stroke-dasharray:300;animation:dw 1.7s ease 1.15s both}
  @keyframes dw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
  .over{fill:#a5661a;font:400 13px ui-monospace,"SFMono-Regular",Menlo,monospace;letter-spacing:6px}
  .name{fill:#1a1713;font:400 76px ui-serif,Georgia,"Times New Roman",serif;letter-spacing:20px}
  .sub{fill:#655c4d;font:400 20px ui-serif,Georgia,"Times New Roman",serif;letter-spacing:3.2px}
  .sig{fill:#655c4d;font:400 11.5px ui-monospace,"SFMono-Regular",Menlo,monospace;letter-spacing:2.6px;opacity:.86}
</style>
