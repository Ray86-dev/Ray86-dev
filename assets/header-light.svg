<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Rayco — Atlantico 28N — filosofia, educacion publica, software">
<title>Rayco — Atlántico 28°N</title>
<defs>
