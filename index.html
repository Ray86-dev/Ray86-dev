<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>atlántico — cinco voces</title>
<meta name="description" content="Una terminal con cinco voces: Heidegger, Séneca, Chestov, Cioran y Dostoievski. Escribe un nombre.">
<meta name="color-scheme" content="dark">
<style>
  :root{
    --bg:#05080e; --bg2:#0a1018;
    --ink:#d7e2f0; --dim:#6b7f99; --faint:#3d4c60;
    --amber:#e8b04b; --sea:#7aa7d9;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:400 15px/1.65 ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    -webkit-text-size-adjust:100%;
  }
  /* viñeta suave, sin estridencias de CRT */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  #screen{
    max-width:860px; margin:0 auto; min-height:100%;
    padding:clamp(20px,5vw,56px) clamp(16px,4vw,32px) 30vh;
    cursor:text;
  }
  #out{white-space:pre-wrap; word-wrap:break-word}
  .l{opacity:0; animation:in .28s ease forwards}
  @keyframes in{to{opacity:1}}
  .ps1{color:var(--amber)}
  .echo{color:var(--ink)}
  .quote{color:var(--ink)}
  .src{color:var(--sea)}
  .gloss{color:var(--dim); font-style:italic}
  .note{color:var(--faint)}
  .err{color:var(--dim)}
  .head{color:var(--amber); letter-spacing:2px}
  .ok{color:var(--dim)}
  .sp{height:.75em}
  #line{display:flex; align-items:baseline; gap:.6ch; margin-top:.2em}
  #ps1{color:var(--amber); flex:none}
  #in{
    flex:1 1 auto; min-width:2ch;
    background:none; border:0; outline:0; padding:0;
    color:var(--ink); font:inherit; caret-color:var(--amber);
  }
  #line.busy{opacity:.35}
  a{color:var(--sea)}
  ::selection{background:rgba(232,176,75,.28)}
</style>
</head>
<body>
<div id="screen">
  <div id="out"></div>
  <div id="line" class="busy">
    <span id="ps1">atlántico:~$</span><input id="in" autocomplete="off" autocapitalize="off"
      autocorrect="off" spellcheck="false" aria-label="Escribe un nombre">
  </div>
</div>

<script>
(function(){
"use strict";

var out = document.getElementById("out");
var line = document.getElementById("line");
var input = document.getElementById("in");

/* ---------- salida ---------- */

function el(text, cls){
  var d = document.createElement("div");
  d.className = "l" + (cls ? " " + cls : "");
  d.textContent = text === "" ? " " : text;
  return d;
}
function put(text, cls){
  out.appendChild(el(text, cls));
  window.scrollTo(0, document.body.scrollHeight);
}
function gap(){
  var d = document.createElement("div");
  d.className = "sp";
  out.appendChild(d);
}

/* Revela las líneas una a una. Solo puede haber un revelado vivo: si llega
   otro comando antes de terminar, el anterior se vuelca de golpe en vez de
   quedarse goteando líneas por encima del nuevo. */
var skipping = false;
var pend = null;

function reveal(lines, done){
  flush();
  line.classList.add("busy");
  pend = { lines: lines, i: 0, timer: null, done: done };
  step();
}
function step(){
  var p = pend;
  if (!p) return;
  if (p.i >= p.lines.length){ finish(); return; }
  var it = p.lines[p.i++];
  if (it === null) gap(); else put(it[0], it[1]);
  p.timer = setTimeout(step, skipping ? 0 : (it === null ? 60 : 90));
}
function finish(){
  var p = pend;
  pend = null;
  if (p && p.timer) clearTimeout(p.timer);
  line.classList.remove("busy");
  skipping = false;
  input.focus();
  if (p && p.done) p.done();
}
function flush(){
  var p = pend;
  if (!p) return;
  if (p.timer) clearTimeout(p.timer);
  while (p.i < p.lines.length){
    var it = p.lines[p.i++];
    if (it === null) gap(); else put(it[0], it[1]);
  }
  finish();
}

/* ---------- las cinco voces ---------- */
/* Entre comillas, cita literal con su obra. En cursiva y gris, glosa: no es
   del autor. Chestov va casi todo en glosa a propósito: prefiero no ponerle
   en la boca traducciones de las que no estoy seguro. */

var VOCES = {
  heidegger: {
    nombre: "MARTIN HEIDEGGER",
    vida: "1889 – 1976",
    frag: [
      [ ["«Die Technik ist eine Weise des Entbergens.»", "quote"],
        ["«La técnica es un modo del desocultar.»", "quote"],
        ["  — La pregunta por la técnica, 1953", "src"],
        null,
        ["No es una herramienta que coges y sueltas. Es una manera en que las", "gloss"],
        ["cosas salen a la luz — y, a la vez, una manera en que se esconden.", "gloss"] ],

      [ ["«Die Sprache ist das Haus des Seins.»", "quote"],
        ["«El lenguaje es la casa del ser.»", "quote"],
        ["  — Carta sobre el humanismo, 1947", "src"],
        null,
        ["Habitamos donde podemos nombrar. Lo que no tiene nombre no tiene sitio.", "gloss"] ],

      [ ["Bauen, Wohnen, Denken — construir, habitar, pensar.", "quote"],
        ["  — Conferencia de Darmstadt, 1951", "src"],
        null,
        ["No se habita porque antes se haya construido.", "gloss"],
        ["Se construye porque de algún modo ya se sabía habitar.", "gloss"] ],

      [ ["«Nur noch ein Gott kann uns retten.»", "quote"],
        ["«Solo un dios puede aún salvarnos.»", "quote"],
        ["  — Entrevista con Der Spiegel, 1966; publicada en 1976", "src"],
        null,
        ["Lo dijo del mundo técnico, no del cielo.", "gloss"] ]
    ]
  },

  seneca: {
    nombre: "LUCIO ANNEO SÉNECA",
    vida: "c. 4 a.C. – 65 d.C.",
    frag: [
      [ ["«Non exiguum temporis habemus, sed multum perdidimus.»", "quote"],
        ["«No tenemos poco tiempo: hemos perdido mucho.»", "quote"],
        ["  — Sobre la brevedad de la vida, I", "src"],
        null,
        ["La queja habitual está mal formulada desde el principio.", "gloss"] ],

      [ ["«Omnia, Lucili, aliena sunt, tempus tantum nostrum est.»", "quote"],
        ["«Todo es ajeno, Lucilio; solo el tiempo es nuestro.»", "quote"],
        ["  — Epístolas a Lucilio, I", "src"] ],

      [ ["«Non quia difficilia sunt non audemus,", "quote"],
        ["  sed quia non audemus difficilia sunt.»", "quote"],
        ["«No es que no nos atrevamos porque las cosas sean difíciles:", "quote"],
        ["  son difíciles porque no nos atrevemos.»", "quote"],
        ["  — Epístolas a Lucilio, 104", "src"] ],

      [ ["«Vivere tota vita discendum est.»", "quote"],
        ["«Toda la vida hay que aprender a vivir.»", "quote"],
        ["  — Sobre la brevedad de la vida, VII", "src"],
        null,
        ["Empezar tarde no es una objeción. Es la condición normal.", "gloss"] ]
    ]
  },

  chestov: {
    nombre: "LEV CHESTOV",
    vida: "1866 – 1938",
    frag: [
      [ ["Atenas y Jerusalén, 1938", "src"],
        null,
        ["Su obra entera cabe en ese título: ¿quién manda, la razón que", "gloss"],
        ["demuestra o la fe que se atreve? Chestov nunca eligió Atenas.", "gloss"] ],

      [ ["La apoteosis de lo infundado, 1905", "src"],
        ["  — el subtítulo es «ensayo de pensamiento adogmático»", "src"],
        null,
        ["Escribió contra la idea de que una verdad, por ser necesaria,", "gloss"],
        ["tenga además derecho a consolarnos. Necesario y bueno no son", "gloss"],
        ["la misma palabra.", "gloss"] ],

      [ ["En la balanza de Job, 1929", "src"],
        null,
        ["Contra Aristóteles: para Chestov la filosofía no empieza en el", "gloss"],
        ["asombro, sino en la desesperación. No se filosofa por curiosidad;", "gloss"],
        ["se filosofa cuando algo se ha roto.", "gloss"] ],

      [ ["Kierkegaard y la filosofía existencial, 1936", "src"],
        null,
        ["Lo que le interesaba de Job y de Abraham era lo mismo: gente que", "gloss"],
        ["sigue discutiendo cuando la razón ya ha dictado sentencia.", "gloss"] ]
    ]
  },

  cioran: {
    nombre: "EMIL CIORAN",
    vida: "1911 – 1995",
    frag: [
      [ ["«Sólo los optimistas se suicidan: los optimistas que ya no", "quote"],
        ["  logran serlo.»", "quote"],
        ["  — Silogismos de la amargura, 1952", "src"] ],

      [ ["«No corremos hacia la muerte: huimos de la catástrofe del", "quote"],
        ["  nacimiento.»", "quote"],
        ["  — Del inconveniente de haber nacido, 1973", "src"] ],

      [ ["«No se habita un país, se habita una lengua.»", "quote"],
        ["  — Confesiones y anatemas, 1987", "src"],
        null,
        ["Lo escribió alguien que dejó el rumano y se pasó al francés", "gloss"],
        ["para el resto de su vida.", "gloss"] ],

      [ ["Del inconveniente de haber nacido, 1973", "src"],
        null,
        ["Habría dicho que nada de esto sirve para nada.", "gloss"],
        ["Probablemente tenga razón. Se construye igual.", "gloss"] ]
    ]
  },

  dostoievski: {
    nombre: "FIÓDOR DOSTOIEVSKI",
    vida: "1821 – 1881",
    frag: [
      [ ["«Soy un hombre enfermo… Soy un hombre malvado.", "quote"],
        ["  Un hombre desagradable soy.»", "quote"],
        ["  — Memorias del subsuelo, 1864; las primeras líneas", "src"] ],

      [ ["«Dos y dos son cuatro ya no es vida, señores:", "quote"],
        ["  es el principio de la muerte.»", "quote"],
        ["  — Memorias del subsuelo, 1864", "src"],
        null,
        ["El subsuelo no discute la aritmética. Discute que la aritmética", "gloss"],
        ["tenga la última palabra sobre lo que uno va a hacer.", "gloss"] ],

      [ ["«Si no existe la inmortalidad del alma, no hay virtud,", "quote"],
        ["  y por lo tanto todo está permitido.»", "quote"],
        ["  — Los hermanos Karamázov, 1880; la tesis de Iván,", "src"],
        ["    tal como la refiere Miusov en el monasterio", "src"],
        null,
        ["La versión que suele citarse — «si Dios no existe, todo está", "gloss"],
        ["permitido» — es un resumen posterior, no una frase del libro.", "gloss"] ],

      [ ["Memorias del subsuelo, 1864", "src"],
        null,
        ["Su hombre del subsuelo diría que da igual que nada sirva:", "gloss"],
        ["que lo único que necesita de verdad una persona es una", "gloss"],
        ["voluntad que sea suya.", "gloss"] ]
    ]
  }
};

var ALIAS = {
  heidegger:"heidegger", martin:"heidegger", "martinheidegger":"heidegger",
  seneca:"seneca", "lucioanneoseneca":"seneca", lucio:"seneca",
  chestov:"chestov", shestov:"chestov", sestov:"chestov", lev:"chestov",
  cioran:"cioran", emil:"cioran", "emilcioran":"cioran",
  dostoievski:"dostoievski", dostoyevski:"dostoievski", dostoevski:"dostoievski",
  dostoyevsky:"dostoievski", fiodor:"dostoievski"
};

var ORDEN = ["heidegger","seneca","chestov","cioran","dostoievski"];
var turno = {};      // qué fragmento toca de cada voz
var oidas = {};      // quién ha hablado ya
ORDEN.forEach(function(k){ turno[k]=0; oidas[k]=false; });

/* ---------- comandos ---------- */

function normaliza(s){
  return s.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")   // fuera tildes
    .replace(/[^a-z0-9 ]/g,"")
    .trim();
}

function hablar(clave){
  var v = VOCES[clave];
  var frag = v.frag[ turno[clave] % v.frag.length ];
  turno[clave]++;

  var lines = [ null, [v.nombre + "   " + v.vida, "head"], null ];
  frag.forEach(function(x){ lines.push(x); });

  var primera = !oidas[clave];
  oidas[clave] = true;

  reveal(lines, function(){
    if (primera && ORDEN.every(function(k){ return oidas[k]; })) {
      reveal([ null,
        ["Han hablado las cinco.", "head"],
        null,
        ["Ninguna se pone de acuerdo con las otras, y ese es justamente", "gloss"],
        ["el motivo de tenerlas a las cinco. Vuelve a llamarlas: cada una", "gloss"],
        ["guarda cuatro fragmentos distintos.", "gloss"] ]);
    }
  });
}

function ayuda(){
  reveal([
    null,
    ["Cinco voces. Escribe un nombre y pulsa Enter.", "head"],
    null,
    ["  heidegger      la técnica, la lengua, el habitar", "echo"],
    ["  séneca         el tiempo, y lo tarde que empezamos", "echo"],
    ["  chestov        la razón contra la fe, y quién gana", "echo"],
    ["  cioran         el inconveniente de haber nacido", "echo"],
    ["  dostoievski    el subsuelo, y dos y dos son cuatro", "echo"],
    null,
    ["Cada una responde algo distinto cada vez que la llamas.", "gloss"],
    null,
    ["  limpiar        borrar la pantalla", "echo"],
    ["  ayuda          esto mismo", "echo"],
    null,
    ["Volver al perfil: github.com/Ray86-dev", "note"]
  ]);
}

function ejecuta(crudo){
  var cmd = normaliza(crudo);

  if (cmd === "") { line.classList.remove("busy"); return; }

  if (cmd === "ayuda" || cmd === "help" || cmd === "?" ) { ayuda(); return; }

  if (cmd === "limpiar" || cmd === "clear" || cmd === "cls") {
    out.textContent = "";
    line.classList.remove("busy");
    input.focus();
    return;
  }

  if (cmd === "salir" || cmd === "exit") {
    reveal([ null,
      ["De aquí no se sale escribiendo «salir».", "gloss"],
      ["Se sale cerrando la pestaña, como de casi todo.", "gloss"] ]);
    return;
  }

  var clave = ALIAS[cmd] || ALIAS[cmd.replace(/ /g,"")];
  if (clave) { hablar(clave); return; }

  reveal([ null,
    ["Ese nombre no está entre las cinco voces.", "err"],
    ["Escribe «ayuda» para verlas.", "err"] ]);
}

/* ---------- entrada ---------- */

var historia = [], hpos = 0;

input.addEventListener("keydown", function(e){
  if (e.key === "Enter"){
    flush();                     // cierra lo que quedara a medias
    var crudo = input.value;
    input.value = "";
    put("atlántico:~$ " + crudo, "ps1");
    if (crudo.trim()){ historia.push(crudo); hpos = historia.length; }
    ejecuta(crudo);
    e.preventDefault();
    return;
  }
  if (e.key === "ArrowUp"){
    if (hpos > 0){ hpos--; input.value = historia[hpos]; }
    e.preventDefault(); return;
  }
  if (e.key === "ArrowDown"){
    if (hpos < historia.length - 1){ hpos++; input.value = historia[hpos]; }
    else { hpos = historia.length; input.value = ""; }
    e.preventDefault(); return;
  }
});

/* pulsar cualquier tecla mientras escribe: acelera el revelado */
document.addEventListener("keydown", function(){
  if (line.classList.contains("busy")) skipping = true;
});
document.addEventListener("click", function(){ input.focus(); });

/* ---------- arranque ---------- */

reveal([
  ["atlántico 28°N", "head"],
  null,
  ["Cinco voces cargadas:", "ok"],
  ["  heidegger · séneca · chestov · cioran · dostoievski", "ok"],
  null,
  ["Escribe un nombre y pulsa Enter.", "echo"],
  ["«ayuda» si te pierdes.", "gloss"],
  null
], function(){ input.focus(); });

})();
</script>
</body>
</html>
